<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word ladder — tests</title>
<style>
  :root { --paper:#faf7f2; --ink:#1a1a1a; --muted:#6b6257; --accent:#a3341f; --good:#1f6b3a; --rule:#d9d2c7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 18px 64px;
    background: var(--paper); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; margin: 0; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
  #score { font-size: 1.6rem; font-weight: 600; margin: 20px 0 4px; }
  #score.pass { color: var(--good); }
  #score.fail { color: var(--accent); }
  #note { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
  h2 { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
       color: var(--muted); margin: 26px 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
  .row { display: flex; gap: 10px; padding: 3px 0; align-items: baseline; }
  .tick { flex: 0 0 4.2rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; }
  .PASS .tick { color: var(--good); }
  .FAIL .tick { color: var(--accent); }
  .SKIP .tick { color: var(--muted); }
  .FAIL .name { color: var(--accent); }
  .name { flex: 1 1 auto; }
  .detail { color: var(--muted); font-size: 0.82rem; }
  #stage { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; }
  #stage iframe { width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>word ladder — tests</h1>
  <p class="sub">Drives the real <code>index.html</code> in an iframe. Browsers sandbox
     <code>file://</code> iframes, so serve the folder (<code>python3 -m http.server</code>)
     and open this page over http.</p>
  <p id="score">running…</p>
  <p id="note"></p>
  <div id="out"></div>
</div>
<div id="stage"></div>

<script>
(function () {
  "use strict";

  var out = document.getElementById("out");
  var pass = 0, fail = 0, skip = 0, failures = [];

  function group(title) {
    var h = document.createElement("h2");
    h.textContent = title;
    out.appendChild(h);
  }
  function row(state, name, detail) {
    var d = document.createElement("div");
    d.className = "row " + state;
    var t = document.createElement("span"); t.className = "tick"; t.textContent = state;
    var n = document.createElement("span"); n.className = "name"; n.textContent = name;
    d.appendChild(t); d.appendChild(n);
    if (detail) { var e = document.createElement("span"); e.className = "detail"; e.textContent = detail; d.appendChild(e); }
    out.appendChild(d);
  }
  function ok(name, cond, detail) {
    if (cond) { pass++; row("PASS", name, detail); }
    else { fail++; failures.push(name + (detail ? " — " + detail : "")); row("FAIL", name, detail); }
    return !!cond;
  }
  function skipped(name, why) { skip++; row("SKIP", name, why); }

  /* ------------------------- iframe harness ------------------------- */

  var KEY = "word-ladder.v1";
  var stage = document.getElementById("stage");
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }

  function seed(blob) {
    try {
      if (blob === null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, blob);
    } catch (e) { /* ignore */ }
  }
  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  // Every row below states the storage it starts from, so the suite starts
  // from none of it. Without this the score depended on whether the player had
  // played first — which is exactly what the README tells them to do. finish()
  // puts their own blob back.
  seed(null);

  // The date every read-only row replays. A ?d= that IS today is today's game,
  // not a replay, so a fixed date would silently become writable on one day of
  // the year and half this suite would be playing with the player's own streak.
  // REPLAY is stepped off today the moment the engine can say what today is.
  var REPLAY = "2026-08-10";

  // Collects everything the page throws or logs as an error. Installed on the
  // window, so it must be re-installed after any document.open() — that call
  // wipes the window's listeners.
  function watch(win) {
    var errors = [];
    win.addEventListener("error", function (ev) { errors.push("error: " + ev.message); });
    win.addEventListener("unhandledrejection", function () { errors.push("unhandledrejection"); });
    var ce = win.console.error;
    win.console.error = function () { errors.push("console.error"); ce.apply(win.console, arguments); };
    return errors;
  }

  function appOf(f, win, errors) {
    return { frame: f, win: win, doc: win.document, errors: errors, WL: win.WL,
             close: function () { if (f.parentNode) f.parentNode.removeChild(f); } };
  }

  function makeFrame(w, h) {
    var f = document.createElement("iframe");
    if (w) { f.style.width = w + "px"; f.style.height = h + "px"; }
    stage.appendChild(f);
    return f;
  }

  // The source of index.html, fetched once so a page can be booted into a
  // window we already hold — see openApp's `early` mode.
  var SRC = null;

  // Writing the page into an about:blank frame is the only way to have the
  // error capture in place BEFORE the page's own inline script runs: attaching
  // it in the frame's load handler is already too late to see a load-time
  // throw. The cost is that location.search is empty, so ?d= rows use the
  // ordinary path.
  function openWritten(w, h) {
    return new Promise(function (resolve, reject) {
      var f = makeFrame(w, h);
      f.addEventListener("load", function onload() {
        f.removeEventListener("load", onload);
        var win = f.contentWindow, errors;
        try {
          win.document.open();
          errors = watch(win);
          win.document.write(SRC);
          win.document.close();
        } catch (e) { reject(new Error("sandboxed")); return; }
        resolve(appOf(f, win, errors));
      });
      f.src = "about:blank";
    });
  }

  function openApp(query, w, h, early) {
    if (early && !query && SRC) return openWritten(w, h);
    return new Promise(function (resolve, reject) {
      var f = makeFrame(w, h);
      f.addEventListener("load", function () {
        var win;
        try { win = f.contentWindow; win.document; win.location.href; }
        catch (e) { reject(new Error("sandboxed")); return; }
        var errors;
        try { errors = watch(win); } catch (e) { reject(new Error("sandboxed")); return; }
        resolve(appOf(f, win, errors));
      });
      f.addEventListener("error", function () { reject(new Error("iframe failed to load")); });
      f.src = "index.html" + (query || "");
    });
  }

  // The control for the row above: a page that throws while loading must be
  // seen to throw, or every "no errors" row in this suite is worth nothing.
  function errorCaptureControl() {
    return new Promise(function (resolve) {
      var f = makeFrame(200, 100);
      f.addEventListener("load", function onload() {
        f.removeEventListener("load", onload);
        var win = f.contentWindow;
        win.document.open();
        var errors = watch(win);
        // The throw is deliberate; keep it out of the console so a reader of
        // this page is not told the suite is broken by the row proving it is not.
        win.addEventListener("error", function (ev) { ev.preventDefault(); });
        win.document.write("<!doctype html><h1>control</h1><scr" + "ipt>throw new Error('deliberate');</scr" + "ipt>");
        win.document.close();
        if (f.parentNode) f.parentNode.removeChild(f);
        resolve(errors);
      });
      f.src = "about:blank";
    });
  }

  function $(app, id) { return app.doc.getElementById(id); }
  function msgOf(app) { return $(app, "msg").textContent; }
  // The rung's aria-label is the word plus, on a played rung, which letter
  // changed. Rows that are asking about the ladder want the word; the rows
  // asking about the label itself use chainLabels() and read it whole.
  function chainLabels(app) {
    var kids = $(app, "chain").children, a = [], i;
    for (i = 0; i < kids.length; i++) a.push(kids[i].getAttribute("aria-label"));
    return a;
  }
  function chainWords(app) {
    return chainLabels(app).map(function (l) { return l.split(",")[0]; });
  }
  function type(app, text) {
    var inp = $(app, "word");
    inp.value = text;
    inp.dispatchEvent(new app.win.Event("input", { bubbles: true }));
  }
  // A real Ctrl+V, not an assignment to .value: the clipboard text reaches the
  // field through the UA's own insertion, which is where a maxlength on the
  // field would cut it — assigning .value skips that rule and cannot see it.
  function paste(app, text) {
    var inp = $(app, "word");
    inp.focus();
    var dt = new app.win.DataTransfer();
    dt.setData("text/plain", text);
    var ev = new app.win.ClipboardEvent("paste", { bubbles: true, cancelable: true, clipboardData: dt });
    inp.dispatchEvent(ev);
    if (!ev.defaultPrevented) {
      var a = inp.selectionStart, b = inp.selectionEnd, v = inp.value;
      if (typeof a !== "number") { a = v.length; b = v.length; }
      var room = inp.maxLength >= 0 ? inp.maxLength - (v.length - (b - a)) : text.length;
      inp.value = v.slice(0, a) + text.slice(0, Math.max(0, room)) + v.slice(b);
    }
    inp.dispatchEvent(new app.win.InputEvent("input", { bubbles: true, inputType: "insertFromPaste" }));
  }
  // One keystroke at a time, the way a person types it.
  function typeKeys(app, text) {
    var inp = $(app, "word"), i;
    inp.value = "";
    inp.focus();
    for (i = 0; i < text.length; i++) {
      inp.value = inp.value + text.charAt(i);
      inp.dispatchEvent(new app.win.InputEvent("input", { bubbles: true, inputType: "insertText", data: text.charAt(i) }));
    }
  }
  function submit(app) { $(app, "submit").click(); }
  function play(app, text) { type(app, text); submit(app); }
  function undoAll(app) {
    var u = $(app, "undo"), guard = 0;
    while (!u.disabled && guard++ < 50) u.click();
  }
  function selected(app) {
    var inp = $(app, "word");
    return inp.value.length > 0 && inp.selectionStart === 0 && inp.selectionEnd === inp.value.length;
  }

  /* ------------------------------ tests ----------------------------- */

  function sourceChecks() {
    group("source integrity of index.html");
    return fetch("index.html").then(function (r) { return r.text(); }).then(function (src) {
      SRC = src;   // reused by openApp's early-boot mode
      ok("index.html contains no Math.random", src.indexOf("Math." + "random") === -1);
      var nonUTC = src.match(/(?<!UTC)get(?:FullYear|Month|Date|Day|Hours|Minutes)\s*\(/g);
      ok("index.html calls no local-time date getters", !nonUTC, nonUTC ? nonUTC.join(" ") : "getUTC* only");
      ok("index.html never touches innerHTML", src.indexOf("inner" + "HTML") === -1);
      ok("index.html makes no network calls", src.indexOf("fetch(") === -1 &&
         src.indexOf("XMLHttpRequest") === -1 && src.indexOf("EventSource") === -1);
      // The file gained exactly one absolute URL on day 036 — the demo link the
      // share card copies — so "no https:// anywhere" stopped being the test.
      // It is replaced by the two questions that rule was standing in for: is
      // anything loaded from off this page, and is that URL still the only one.
      ok("index.html loads no external asset", src.indexOf("http://") === -1 &&
         !/<script[^>]+src=/i.test(src) && !/<link[^>]+stylesheet/i.test(src) &&
         !/(?:src|href)\s*=\s*["']https:/i.test(src));
      ok("the only absolute URL in index.html is the share link, and nothing fetches it",
         (src.match(/https:\/\//g) || []).length === 1 &&
         src.indexOf('"https://yinggarykairui.github.io/word-ladder/"') !== -1,
         (src.match(/https:\/\/[^"'\s]*/g) || []).join(" "));
      ok("index.html uses the storage key word-ladder.v1", src.indexOf('"word-ladder.v1"') !== -1);
    }, function () {
      ["contains no Math.random", "calls no local-time date getters", "never touches innerHTML",
       "makes no network calls", "loads no external asset",
       "carries the share link as its only absolute URL", "uses the storage key word-ladder.v1"]
        .forEach(function (n) { skipped("index.html " + n, "source unreadable from file:// — serve over http"); });
    });
  }

  function listAndPuzzles(app) {
    var WL = app.WL, W = WL.WORDS, i, bad;

    group("word list integrity");
    ok("word list has at least 500 entries", W.length >= 500, W.length + " entries");
    bad = W.filter(function (w) { return !/^[a-z]{4}$/.test(w); });
    ok("every entry matches /^[a-z]{4}$/", bad.length === 0, bad.slice(0, 5).join(" "));
    var uniq = {}, dupes = [];
    for (i = 0; i < W.length; i++) { if (uniq[W[i]]) dupes.push(W[i]); uniq[W[i]] = 1; }
    ok("no duplicate entries", dupes.length === 0, dupes.slice(0, 5).join(" "));
    var unsorted = [];
    for (i = 1; i < W.length; i++) if (W[i - 1] >= W[i]) unsorted.push(W[i - 1] + ">" + W[i]);
    ok("list is sorted ascending", unsorted.length === 0, unsorted.slice(0, 3).join(" "));
    var frac = WL.COMP.length / W.length;
    ok("largest connected component holds at least 60% of entries", frac >= 0.6,
       WL.COMP.length + "/" + W.length + " = " + (frac * 100).toFixed(1) + "%");

    // 30 consecutive dates, starting the day before today so today is included.
    var dates = [], base = WL.shiftDays(WL.today, -1);
    for (i = 0; i < 30; i++) dates.push(WL.shiftDays(base, i));

    group("determinism — 30 consecutive dates");
    var drift = [];
    dates.forEach(function (d) {
      var a = WL.puzzleFor(d), b = WL.puzzleFor(d), c = WL.puzzleFor(d);
      var k = function (p) { return p.start + ">" + p.target + ":" + p.par; };
      if (!(k(a) === k(b) && k(b) === k(c))) drift.push(d);
    });
    ok("three independent runs agree on {start, target, par} for all 30 dates",
       drift.length === 0, drift.join(" ") || dates[0] + " … " + dates[29]);
    ok("the rendered header shows today's UTC date",
       $(app, "date").textContent === "Puzzle for " + WL.utcDateStr(new Date()) + " · UTC",
       $(app, "date").textContent);
    // Frozen expectations: the puzzle is a pure function of the date string and
    // this exact word list, so these three pairs cannot move without the list
    // moving. A row that only asserts "two dates differ" would pass on almost
    // any generator, including a broken one.
    var golden = [["2020-02-29", "pink>bone:4"], ["2026-01-15", "heal>bold:4"], ["2030-12-31", "doll>base:5"]];
    var goldBad = golden.filter(function (g) {
      var q = WL.puzzleFor(g[0]);
      return q.start + ">" + q.target + ":" + q.par !== g[1];
    });
    ok("three frozen dates still generate the exact pairs they shipped with",
       goldBad.length === 0, goldBad.map(function (g) {
         var q = WL.puzzleFor(g[0]);
         return g[0] + " " + q.start + ">" + q.target + ":" + q.par + " != " + g[1];
       }).join(" ") || golden.map(function (g) { return g[0] + " " + g[1]; }).join(", "));
    var pairs = {}, npairs = 0;
    dates.forEach(function (d) {
      var q = WL.puzzleFor(d), k = q.start + ">" + q.target;
      if (!pairs[k]) { pairs[k] = 1; npairs++; }
    });
    ok("30 consecutive dates give at least 25 distinct pairs", npairs >= 25, npairs + " distinct");
    var seedA = WL.fnv1a32("word-ladder:2026-08-10");
    ok("fnv1a32 is stable and 32-bit unsigned", seedA === WL.fnv1a32("word-ladder:2026-08-10") &&
       seedA >= 0 && seedA <= 4294967295 && Math.floor(seedA) === seedA, "seed " + seedA);

    group("solvability — the BFS path is walked, not trusted");
    var badWalk = [], badPar = [], notMember = [], hows = {};
    var set = {}; for (i = 0; i < W.length; i++) set[W[i]] = 1;
    var comp = {}; for (i = 0; i < WL.COMP.length; i++) comp[WL.COMP[i]] = 1;
    dates.forEach(function (d) {
      var p = WL.puzzleFor(d);
      hows[p.how] = (hows[p.how] || 0) + 1;
      if (!p) { badWalk.push(d + ":none"); return; }
      if (!comp[p.start] || !comp[p.target] ||
          WL.NBR[p.start].length < 2 || WL.NBR[p.target].length < 2) notMember.push(d);
      var path = WL.pathOf(p);
      if (!path || path[0] !== p.start || path[path.length - 1] !== p.target) { badWalk.push(d + ":ends"); return; }
      if (path.length - 1 !== p.par) { badWalk.push(d + ":length"); return; }
      for (var j = 0; j < path.length; j++) {
        if (!set[path[j]]) { badWalk.push(d + ":" + path[j] + " not in list"); return; }
        if (j && WL.diffCount(path[j], path[j - 1]) !== 1) { badWalk.push(d + ":" + path[j - 1] + "->" + path[j]); return; }
      }
      var lo = p.how === "distance 3-5" ? 3 : 2, hi = p.how === "distance 3-5" ? 5 : 6;
      if (p.par < lo || p.par > hi) badPar.push(d + ":" + p.par + " (" + p.how + ")");
    });
    ok("every date's parent chain is a legal ladder ending at the target",
       badWalk.length === 0, badWalk.slice(0, 3).join(" ") || "30/30 walked");
    ok("every par is inside the band its generation branch promises",
       badPar.length === 0, badPar.slice(0, 3).join(" ") || Object.keys(hows).map(function (k) {
         return k + " x" + hows[k]; }).join(", "));
    // Recorded, not asserted as coverage: on the shipped word list the first
    // branch has never failed to find a pair — 3,288 dates from 2020 to 2028 all
    // return "distance 3-5" — so the widen branch, the sorted-scan fallback and
    // the no-puzzle guard are unreachable insurance, and the band row above only
    // ever exercises 3-5. Reaching them needs a different word list, which would
    // be a different build.
    ok("the generation branch is recorded, so a change of branch cannot pass unnoticed",
       Object.keys(hows).length === 1 && hows["distance 3-5"] === 30,
       Object.keys(hows).map(function (k) { return k + " x" + hows[k]; }).join(", "));
    ok("every start and target is in the largest component with degree >= 2",
       notMember.length === 0, notMember.slice(0, 3).join(" ") || "30/30");
    ok("today's puzzle is solvable in exactly the par shown",
       (function () {
         var p = WL.puzzle, path = WL.pathOf(p);
         return path && path.length - 1 === p.par &&
                $(app, "status").textContent === "best possible: " + p.par + " moves";
       }()), WL.puzzle.start.toUpperCase() + " -> " + WL.puzzle.target.toUpperCase() +
             ", par " + WL.puzzle.par);

    group("focus order");
    // On a fresh puzzle the ladder column holds one rung and has nothing to
    // scroll, so it is not a tab stop: a Shift-Tab out of the input used to
    // land there with nothing hidden in it and no way to tell that from a dead
    // stop. It becomes one the moment it overflows (rows in the sweep below).
    // Rendered, not merely present: the share button and its fallback field are
    // in the markup from load and display:none until the ladder reaches the
    // target, so a query that counts markup counts controls no Tab can reach.
    function tabbables(app) {
      var f = app.doc.querySelectorAll(
        'input, button, a[href], select, textarea, [tabindex]:not([tabindex="-1"])'), i, out = [];
      for (i = 0; i < f.length; i++) if (f[i].getClientRects().length) out.push(f[i]);
      return out;
    }
    ok("tab order is the input, then Submit, then Undo, with nothing focusable between the three controls",
       (function () {
         var f = tabbables(app);
         return f.length === 3 && f[0].id === "word" &&
                f[1].id === "submit" && f[2].id === "undo";
       }()), tabbables(app).map(function (e) { return e.id; }).join(" > "));
    ok("the share controls are not on a board that has not been solved",
       $(app, "share").getClientRects().length === 0 &&
       $(app, "sharebox").getClientRects().length === 0 &&
       $(app, "share").className === "hidden" && $(app, "sharebox").className === "hidden",
       "share " + $(app, "share").className + ", sharebox " + $(app, "sharebox").className);
    ok("the ladder column is not a tab stop while there is nothing in it to scroll",
       $(app, "chainbox").tabIndex === -1 &&
       $(app, "chainbox").scrollHeight <= $(app, "chainbox").clientHeight,
       "tabIndex " + $(app, "chainbox").tabIndex + ", " +
       $(app, "chainbox").scrollHeight + " in " + $(app, "chainbox").clientHeight + "px");
    ok("the ladder scroller carries an accessible name, so the tab stop says what it is when it is one",
       $(app, "chainbox").getAttribute("aria-label") === "the ladder so far" &&
       $(app, "chainbox").getAttribute("role") === "group",
       $(app, "chainbox").getAttribute("aria-label"));
  }

  function inputMatrix() {
    group("input handling — garbage in, and the right thing out");
    // ?d= keeps the whole matrix read-only: nothing here can touch a real streak.
    var date = REPLAY;
    return openApp("?d=" + date, 390, 844).then(function (app) {
      var WL = app.WL, path = WL.pathOf(WL.puzzle).map(function (w) { return w.toUpperCase(); });
      var START = path[0], NEXT = path[1], TARGET = path[path.length - 1];
      var twoAway = null, i;
      for (i = 0; i < WL.WORDS.length; i++) {
        if (WL.diffCount(WL.WORDS[i].toUpperCase(), START) === 2) { twoAway = WL.WORDS[i].toUpperCase(); break; }
      }

      // --- rejections and no-ops: the chain must not grow ---
      ok("an empty submit acts instead of talking: it focuses the field and says nothing",
         (function () {
           play(app, "ZZZZ");            // leave a verdict on screen first
           var had = msgOf(app);
           play(app, "");
           return had === "ZZZZ isn't in the list" && chainWords(app).length === 1 &&
                  msgOf(app) === "" && app.doc.activeElement === $(app, "word");
         }()), JSON.stringify(msgOf(app)));
      undoAll(app);
      ok("four spaces leave the field empty and the chain alone",
         (function () { play(app, "    "); return $(app, "word").value === "" && chainWords(app).length === 1; }()));
      ok("ZZZZ is refused by name", (function () { play(app, "ZZZZ"); return msgOf(app) === "ZZZZ isn't in the list"; }()),
         msgOf(app));
      ok("a refused word stays in the field and is selected", selected(app), $(app, "word").value);
      ok("three letters ask for four",
         (function () { play(app, START.slice(0, 3)); return msgOf(app) === "needs four letters"; }()), msgOf(app));
      ok("repeating the word above is named as such",
         (function () { play(app, START); return msgOf(app) === "that's the same word"; }()), msgOf(app));
      ok("a two-letter jump is refused",
         (function () { play(app, twoAway); return msgOf(app) === "change exactly one letter"; }()),
         twoAway + " -> " + msgOf(app));
      ok("digits alone leave the field empty",
         (function () { play(app, "1234"); return $(app, "word").value === "" && chainWords(app).length === 1; }()));
      ok("emoji leave the field empty",
         (function () { play(app, "😀🚀"); return $(app, "word").value === "" && chainWords(app).length === 1; }()));
      // The blob's first four letters spell a real word that is two letters from
      // the rung above, with only punctuation, digits, emoji and CJK after it —
      // so this row fails if the field stops truncating (the value would be
      // longer), if the fold breaks (the word would not be recognised), or if
      // the rule table stops running on pasted text (no verdict).
      var blob = twoAway.split("").join("3! 😀-中") + "1234567890!@#$%^&*() 😀-中".repeat(200);

  function longWalk(app, n) {
    var WL = app.WL, seen = {}, out = [], cur = WL.puzzle.start, ns, i, nx;
    seen[cur] = 1; seen[WL.puzzle.target] = 1;
    while (out.length < n) {

      for (i = 0; i < ns.length; i++) { if (!seen[ns[i]]) { nx = ns[i]; break; } }

  function say_clear(app) { $(app, "word").value = ""; }



  /* -------- the stored chain always round-trips (R1) --------------------
     Cycle 2 re-enabled Submit after a solve, which let a rung be played past
     the target. The loader refuses a chain whose target is not its last rung,
     so the next reload silently emptied the day's progress while storage still
     said the day was won — and none of the 147 rows could see it. These rows
     do not enumerate the paths anyone thought of: they reload after each walk
     and compare what comes back with what was on the screen, and they check the
     stored chain's shape directly. */

  function snapOf(app) {
    return {
      chain: app.WL.state().chain.join(" "),
      status: $(app, "status").textContent,
      lab: $(app, "targetlab").textContent,
      streak: $(app, "streak").textContent
    };
  }
  function sameSnap(a, b) {
    return a.chain === b.chain && a.status === b.status && a.lab === b.lab && a.streak === b.streak;
  }
  function snapStr(s) { return s.chain + " | " + s.status + " | " + s.lab + " | " + s.streak; }

  // The shape the loader will accept: a ladder from the start word, no repeats,
  // and the target only ever as the last rung.
  function storedChainIsLegal(WL, target, start) {
    var b = blobOf(), i, seen = {}, d, j;
    if (!b || !b.chain) return "no chain stored";
    if (b.chain[0] !== start) return "does not start at " + start;
    for (i = 0; i < b.chain.length; i++) {
      if (seen[b.chain[i]]) return "repeats " + b.chain[i];
      seen[b.chain[i]] = 1;
      if (b.chain[i] === target && i !== b.chain.length - 1) return "buries the target at " + i;
      if (i) {
        d = 0;
        for (j = 0; j < 4; j++) if (b.chain[i].charAt(j) !== b.chain[i - 1].charAt(j)) d++;
        if (d !== 1) return b.chain[i - 1] + "->" + b.chain[i] + " is not one letter";
      }
    }
    return null;
  }

  function roundTrip(WL) {
    group("the stored chain always round-trips (R1)");
    seed(null);
    var path, TARGET, START, beyond, before, chainAtSolve;
    return openApp("", 390, 844).then(function (app) {
      path = app.WL.pathOf(app.WL.puzzle).map(function (x) { return x.toUpperCase(); });
      TARGET = path[path.length - 1];
      START = path[0];
      solveIn(app);
      chainAtSolve = app.WL.state().chain.join(" ");
      // a real word, one letter from the target, not yet used — the repro
      beyond = (function () {
        var ns = app.WL.NBR[TARGET.toLowerCase()], cur = app.WL.state().chain, i, u;
        for (i = 0; i < ns.length; i++) {
          u = ns[i].toUpperCase();
          if (cur.indexOf(u) === -1) return u;
        }
        return null;
      }());
      var wonMsg = msgOf(app);
      play(app, beyond);
      // Was: "refused, not appended" — the refusal was the whole defence. Now
      // there is no control left to refuse: the field is put away and Submit is
      // spent with it, so a word past the target cannot be submitted at all.
      // The chain is what matters, and it does not move either way.
      ok("once the ladder reaches the target there is no control left to append past it",
         $(app, "submit").disabled === true && msgOf(app) === wonMsg &&
         app.WL.state().chain.join(" ") === chainAtSolve,
         beyond + " -> " + msgOf(app) + " / " + app.WL.state().chain.join(" "));
      // The state rule behind the spent button, driven the only way left: a
      // submit event on the form itself. A player cannot get here, but a stored
      // chain with the target buried mid-way is the shape the loader refuses to
      // restore, so the guard is not allowed to rot.
      ok("and the guard under it still refuses a word past the target when the form is submitted directly",
         (function () {
           $(app, "word").value = beyond;
           $(app, "play").requestSubmit();
           return msgOf(app) === "already at the target — Undo to step back" &&
                  app.WL.state().chain.join(" ") === chainAtSolve;
         }()), msgOf(app) + " / " + app.WL.state().chain.join(" "));
      $(app, "word").value = "";
      ok("and the refusal leaves the target drawn once, as the target line",
         chainWords(app).indexOf(TARGET) === -1 && $(app, "targetlab").textContent === "solved",
         chainWords(app).join(" "));
      ok("the stored chain is still a chain the loader will accept",
         storedChainIsLegal(WL, TARGET, START) === null, storedChainIsLegal(WL, TARGET, START) || blobOf().chain.join(">"));
      before = snapOf(app);
      app.close();
      return openApp("", 390, 844);
    }).then(function (app) {
      ok("(walk 1) solve -> submit past the target -> reload brings back what was on screen",
         sameSnap(before, snapOf(app)), snapStr(before) + "   vs   " + snapStr(snapOf(app)));
      // walk 2: solve -> undo -> submit -> reload
      $(app, "undo").click();
      var ns = app.WL.NBR[app.WL.state().chain[app.WL.state().chain.length - 1].toLowerCase()];
      var cur = app.WL.state().chain, i, u, nxt = null;
      for (i = 0; i < ns.length; i++) {
        u = ns[i].toUpperCase();

      }
      if (nxt) play(app, nxt);
      ok("the stored chain after undo-then-play is still one the loader will accept",
         storedChainIsLegal(WL, TARGET, START) === null, storedChainIsLegal(WL, TARGET, START) || blobOf().chain.join(">"));
      before = snapOf(app);
      app.close();
      return openApp("", 390, 844);
    }).then(function (app) {
      ok("(walk 2) solve -> undo -> play a different rung -> reload brings back what was on screen",
         sameSnap(before, snapOf(app)), snapStr(before) + "   vs   " + snapStr(snapOf(app)));
      // walk 3: undo all the way back, replay to the target
      undoAll(app);
      ok("(walk 3) undo back to the start word leaves a one-word chain the loader accepts",
         app.WL.state().chain.length === 1 && storedChainIsLegal(WL, TARGET, START) === null,
         blobOf().chain.join(">"));
      solveIn(app);
      before = snapOf(app);
      app.close();
      return openApp("", 390, 844);
    }).then(function (app) {
      ok("(walk 3) undo-to-start -> replay to the target -> reload brings back what was on screen",
         sameSnap(before, snapOf(app)), snapStr(before) + "   vs   " + snapStr(snapOf(app)));
      ok("(walk 3) and the day is still won exactly once",
         blobOf().streak === 1 && blobOf().best === 1 && blobOf().solved === true,
         JSON.stringify(blobOf()));
      ok("the screen and the blob agree about the win after every walk",
         (blobOf().solved === true) === ($(app, "status").textContent.indexOf("solved") === 0 &&
                                          $(app, "targetlab").textContent === "solved"),
         $(app, "status").textContent + " / " + $(app, "targetlab").textContent);

  /* ---------------- the viewport HEIGHT axis (C1, C2) ---------------------
     Cycle 1 swept two widths and no heights, and a layout that collapsed the
     ladder column to 0px on every phone in landscape passed 101 assertions.
     These rows walk eight viewports — five of them shorter than 430px — at
     three chain states, and ask three questions at each: does anything overlap
     anything, can the ladder column ever collapse below one legible rung, and
     is anything hidden with no way to reach it. */

  var SWEEP_VIEWPORTS = [
    [320, 400], [390, 420], [640, 360], [844, 390], [812, 375],
    [320, 568], [390, 844], [1280, 800]
  ];
  // The three where the whole page is meant to fit without scrolling at all.
  var ONE_SCREENFUL = { "320x568": 1, "390x844": 1, "1280x800": 1 };

  function layoutBoxes(app) {
    var sel = ["h1", ".tag", "#date", "#streak", "#chainbox", "#inputrow", "#word",
               ".hr", "#target", "#targetlab", "#status", ".controls", "#submit", "#undo", "#msg"];
    var out = [], i, e, r;
    for (i = 0; i < sel.length; i++) {
      e = app.doc.querySelector(sel[i]);
      if (!e) continue;
      r = e.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      out.push([sel[i], e, r]);
    }
    return out;
  }

  function heightSweep(w, h) {
    var label = w + "x" + h;
    return openApp("?d=" + REPLAY, w, h).then(function (app) {
      group("layout at " + label + " — the height axis");
      var states = ["empty", "midplay", "solved"];
      var path = app.WL.pathOf(app.WL.puzzle).map(function (x) { return x.toUpperCase(); });
      var laps = [], collapse = [], unreachable = [], b1 = [], deadCtrl = [];
      var si, i, j, a, bx;

      for (si = 0; si < states.length; si++) {
        undoAll(app);
        var words = states[si] === "empty" ? [] :
                    states[si] === "solved" ? path.slice(1) : path.slice(1, 3);
        for (i = 0; i < words.length; i++) play(app, words[i]);
        $(app, "word").value = "";

        // 1. nothing overlaps anything
        var boxes = layoutBoxes(app);
        for (i = 0; i < boxes.length; i++) {
          for (j = i + 1; j < boxes.length; j++) {
            if (boxes[i][1].contains(boxes[j][1]) || boxes[j][1].contains(boxes[i][1])) continue;
            a = boxes[i][2]; bx = boxes[j][2];
            if (a.left < bx.right - 0.5 && bx.left < a.right - 0.5 &&
                a.top < bx.bottom - 0.5 && bx.top < a.bottom - 0.5) {
              laps.push(states[si] + " " + boxes[i][0] + " x " + boxes[j][0]);
            }
          }
        }

        // 2. the ladder column never collapses under one legible rung
        var cb = $(app, "chainbox");
        if (cb.clientHeight < 44) collapse.push(states[si] + " chainbox " + cb.clientHeight + "px");

        // 3. nothing is hidden without a way to reach it
        if (cb.scrollHeight > cb.clientHeight + 1) {

  /* -------- rotation: the same page, a different viewport (C9) ------------
     Every row above loads the page at the size it tests it at. A phone that is
     turned over does not reload: the ladder column keeps whatever tab stop and
     scroll position it was given by the last render(), and both are answers to
     a question about the old viewport. */

  function resizeTo(app, w, h) {
    app.frame.style.width = w + "px";
    app.frame.style.height = h + "px";
    // A resize event, then a frame for the layout it causes.
    return new Promise(function (res) {
      setTimeout(function () { app.win.requestAnimationFrame(function () { res(app); }); }, 80);
    });

  function pinned(cb) { return cb.scrollHeight - cb.clientHeight - cb.scrollTop <= 1; }
  function tabRight(cb) { return cb.tabIndex === (cb.scrollHeight > cb.clientHeight ? 0 : -1); }

           "px, scrollTop " + Math.round(cb.scrollTop);

  /* ------- the live region across frames, not just across writes (C5) -----
     The rows in the input matrix read #msg synchronously, which is what a
     player's eye does. A screen reader does not: it is handed the diff the
     renderer computes at the end of the task, and two writes inside one task
     are one diff. These rows watch the line across frames instead. */

  function frames(app, n) {
    return new Promise(function (res) {
      (function step(k) {
        if (!k) { res(); return; }
        app.win.requestAnimationFrame(function () { step(k - 1); });
      }(n));
    });
  }

         syncText === "ZZZZ isn't in the list" && blank === "" &&

         $(app0, "msg").className === "msg warn",
         JSON.stringify(syncText) + " -> " + JSON.stringify(blank) + " -> " + JSON.stringify(msgOf(app0)));
      // The blank frame must never eat a message that arrived during it.
      play(app0, "ZZZZ");
      $(app0, "word").value = "";

      // not blanked either, so nothing flickers on the ordinary path.
      var seen = [];

        seen.push(msgOf(app0));
        return frames(app0, 1);

           seen.join("|") === ["ZZZZ isn't in the list", "ZZZZ isn't in the list",

        // rung it stands on is a callback firing. Drop the second one — no

        // the line the player is reading stayed blank for good. The timer is
        // the backstop; this is the only way to see it work.

          };

          return new Promise(function (res) { setTimeout(res, 260); }).then(function () {
            app0.win.requestAnimationFrame = realRAF;
            ok("a dropped animation frame cannot leave the message line blank (C11)",
               msgOf(app0) === "ZZZZ isn't in the list" && calls === 2,
               JSON.stringify(msgOf(app0)) + " after " + calls + " frames asked for");
            ok("no window errors or console.error across the live-region rows",
               app0.errors.length === 0, app0.errors.slice(0, 2).join(" | ") || "0 errors");
            app0.close();

  // navigator.clipboard at all, and a permissions policy makes writeText
  // reject on https — so both are rows here rather than a comment about a
  // branch nobody runs. navigator.clipboard is a prototype getter, so an own
  // property is what shadows it.
  function fakeClipboard(app, mode) {
    var calls = [];
    var value = mode === "absent" ? undefined : {
      writeText: function (t) {
        calls.push(t);
        return mode === "reject" ? Promise.reject(new Error("denied")) : Promise.resolve();
      }
    };
    try {
      Object.defineProperty(app.win.navigator, "clipboard",
        { configurable: true, get: function () { return value; } });
    } catch (e) { /* ignore */ }
    return calls;
  }

  // Every character of the line is either a literal from this template or a
  // digit. That is the spoiler rule stated as a shape: there is nowhere in it
  // for a word to hide, whoever played it and however they got there.
  var SHARE_RE = /^word ladder \d{4}-\d{2}-\d{2} · solved in \d+ moves · best possible \d+ · streak \d+\nhttps:\/\/yinggarykairui\.github\.io\/word-ladder\/$/;
  var SHARE_RE_REPLAY = /^word ladder \d{4}-\d{2}-\d{2} · solved in \d+ moves · best possible \d+\nhttps:\/\/yinggarykairui\.github\.io\/word-ladder\/$/;

  // A fixed setTimeout is a bet on the frame budget of an off-screen iframe.
  // The first version of these rows bet 30ms and lost about one run in five —
  // see the note on say()'s repeat branch in the share group below.
  function waitFor(pred, ms) {
    var t0 = Date.now();
    return new Promise(function (res) {
      (function tick() {
        var done = false;
        try { done = pred(); } catch (e) { done = false; }
        if (done || Date.now() - t0 > (ms || 2000)) return res();
        setTimeout(tick, 10);
      }());
    });
  }

  // localStorage.setItem, counted rather than inferred. Comparing the blob
  // before and after cannot see a write of identical bytes, so the row that
  // said "Share writes nothing to storage" passed a mutant that called save().
  function countWrites(app) {
    var n = { writes: 0 };
    var ls = app.win.localStorage, real = ls.setItem;
    n.stop = function () { try { ls.setItem = real; } catch (e) { /* ignore */ } };
    try {
      ls.setItem = function () { n.writes++; return real.apply(ls, arguments); };
    } catch (e) { n.unavailable = true; }
    return n;
  }

  function shareCard() {
    var app;
    seed(null);
    return openApp("", 390, 844).then(function (a) {
      app = a;
      group("the share card — the result travels, the puzzle does not");

      var beforeSolve = $(app, "share").getClientRects().length;
      var path = solvePath(app);
      var text = app.WL.shareText();

      ok("Share is not on the board until the ladder reaches the target",
         beforeSolve === 0 && $(app, "share").getClientRects().length > 0,
         "before " + beforeSolve + " rects, after " + $(app, "share").getClientRects().length);

      ok("the line is the template and digits, and nothing else",
         SHARE_RE.test(text), JSON.stringify(text));

      ok("no word of the day's ladder appears in it",
         (function () {
           var lower = text.toLowerCase(), i;
           for (i = 0; i < path.length; i++) if (lower.indexOf(path[i].toLowerCase()) !== -1) return false;
           return lower.indexOf(app.WL.puzzle.target) === -1 && lower.indexOf(app.WL.puzzle.start) === -1;
         }()), path.join(" ") + " — none of them in " + JSON.stringify(text.split("\n")[0]));

      // README: "the same number is named the same way everywhere it appears".
      // The share line is a third place it appears, so it owes that promise the
      // status line's exact words, not a paraphrase of them.
      ok("the number is named the same way in the share line as on the status line",
         text.indexOf("solved in " + (path.length - 1) + " moves · best possible " + app.WL.puzzle.par) !== -1 &&
         $(app, "status").textContent === "solved in " + (path.length - 1) +
           " moves · best possible " + app.WL.puzzle.par,
         $(app, "status").textContent + "  ||  " + text.split("\n")[0]);

      // R1's invariant, extended to the control added today: no sequence of UI
      // actions may produce a stored chain that legalChain rejects. The safest
      // form of that for a button that is not supposed to touch the game at all
      // is that it touches neither the chain nor the blob.
      var counter = countWrites(app), chainBefore = app.WL.state().chain.join(" ");
      var calls = fakeClipboard(app, "ok");
      $(app, "share").click();
      return waitFor(function () { return msgOf(app) === "result copied"; }).then(function () {
        // Counted, not inferred: comparing the blob before and after cannot see
        // a write of identical bytes, and a deliberate save() inside the copy
        // path passed that version of this row.
        ok("Share appends nothing to the chain and calls setItem not once",
           app.WL.state().chain.join(" ") === chainBefore && counter.writes === 0,
           counter.writes + " setItem call(s), chain " + app.WL.state().chain.join(" "));
        counter.stop();
        ok("a clipboard that takes it is told exactly what the page says it copied",
           calls.length === 1 && calls[0] === text, calls.length + " write(s)");
        ok("a copy the player cannot see is announced in the live region",
           msgOf(app) === "result copied" && $(app, "sharebox").getClientRects().length === 0,
           msgOf(app) + " · box " + $(app, "sharebox").className);
        // A copy changes nothing else on the page, so the control acknowledges
        // its own press — and gives it back, or the board keeps a stale word on
        // a button that is live again.
        ok("the button says it copied, and stops saying it",
           $(app, "share").textContent === "Copied", $(app, "share").textContent);
        // A lower bound as well as an upper one: a label that reverts in the
        // next frame is not an acknowledgement anyone can read, and a row that
        // only waits for the revert cannot tell 1600ms from 60ms.
        return waitFor(function () { return false; }, 400).then(function () {
          ok("and it is still saying it 400ms later, not gone in a frame",
             $(app, "share").textContent === "Copied", $(app, "share").textContent);
          return waitFor(function () { return $(app, "share").textContent === "Share"; }, 3000);
        })
          .then(function () {
            ok("the Copied label reverts on its own", $(app, "share").textContent === "Share",
               $(app, "share").textContent);

            // The fallback, twice: a clipboard that is not there, and one that
            // says no. Each is entered from a closed box with a different
            // message on the line — say()'s repeat branch blanks the live region
            // for a frame when it is handed the string already on it, which is
            // invisible to a player and was enough to make this row flake about
            // one run in five when the two cases ran back to back.
            var calls2 = fakeClipboard(app, "absent");
            $(app, "share").click();
            return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; })
              .then(function () {
                var ta = $(app, "sharetext");
                ok("with no clipboard at all the line is on the page, selected, with somewhere to copy it from",
                   ta.getClientRects().length > 0 && ta.value === text &&
                   ta.selectionStart === 0 && ta.selectionEnd === ta.value.length &&
                   app.doc.activeElement === ta && msgOf(app).indexOf("copy this line") === 0,
                   "value " + JSON.stringify(ta.value) + " · msg " + msgOf(app));
                ok("the fallback field is read-only, so the line cannot be edited into a claim the page did not make",
                   ta.readOnly === true && ta.tagName === "TEXTAREA", ta.tagName + " readOnly " + ta.readOnly);
                // The whole point of the fallback is that the player can read
                // what they are being told to copy. rows="2" could not: the line
                // wraps to three rendered rows at 390px and four at 320px.
                ok("every line of it is visible — the field is sized to what it holds",
                   ta.scrollHeight <= ta.clientHeight && ta.scrollTop === 0,
                   "scrollHeight " + ta.scrollHeight + " in clientHeight " + ta.clientHeight);
                // A rotation changes the width the line wraps at without
                // touching the line. Sized once at 390 and read at 320, the
                // field hid 19px of it; at 280, 38px. The frame is resized
                // under the open box, which is the same event a phone turned
                // over fires.
                var wasW = app.frame.style.width, wasH = app.frame.style.height;
                app.frame.style.width = "320px"; app.frame.style.height = "568px";
                return waitFor(function () { return ta.scrollHeight <= ta.clientHeight; }, 500)
                  .then(function () {
                    ok("and it is re-sized when the width it wraps at changes",
                       ta.scrollHeight <= ta.clientHeight,
                       "at 320px: scrollHeight " + ta.scrollHeight + " in clientHeight " + ta.clientHeight);
                    app.frame.style.width = wasW; app.frame.style.height = wasH;
                    return waitFor(function () { return false; }, 60);
                  }).then(function () {

                // Back to a closed box and a different message, so the reject
                // case is entered from the same place the absent case was.
                $(app, "undo").click();
                play(app, path[path.length - 1]);
                var calls3 = fakeClipboard(app, "reject");
                $(app, "share").click();
                return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; })
                  .then(function () {
                    ok("a clipboard that rejects lands in the same fallback, not in an unhandled rejection",
                       calls3.length === 1 && $(app, "sharetext").getClientRects().length > 0 &&
                       msgOf(app).indexOf("copy this line") === 0 && app.errors.length === 0,
                       app.errors.join(" ") || "no errors, box open");

                    // Undo is the move back to play, and a result line for a
                    // ladder that no longer reaches the target is not a result.
                    $(app, "undo").click();
                    ok("stepping off the target puts the share card away and the caret back in the field",
                       $(app, "share").getClientRects().length === 0 &&
                       $(app, "sharebox").getClientRects().length === 0 &&
                       app.WL.state().shareOpen === false &&
                       app.doc.activeElement === $(app, "word"),
                       "share " + $(app, "share").className + ", box " + $(app, "sharebox").className +
                       ", focus " + (app.doc.activeElement && app.doc.activeElement.id));
                    ok("no error was thrown anywhere in the share paths", app.errors.length === 0,
                       app.errors.join(" ") || "clean");
                    app.close();
                  });
              });
              });
          });
      });
    }).then(function () {
      return openApp("?d=" + REPLAY, 390, 844);
    }).then(function (app) {
      group("the share card under ?d= — a replay has no streak to claim");
      solvePath(app);
      var text = app.WL.shareText(), blobBefore = stored();
      ok("the streak clause is omitted, not printed as zero",
         SHARE_RE_REPLAY.test(text) && text.indexOf("streak") === -1, JSON.stringify(text));
      var counter = countWrites(app);
      fakeClipboard(app, "absent");
      $(app, "share").click();
      return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; }).then(function () {
        ok("pressing Share on a replay writes nothing to storage",
           stored() === blobBefore && counter.writes === 0,
           counter.writes + " setItem call(s)");
        counter.stop();
        ok("the fallback still opens on a replay board", $(app, "sharetext").getClientRects().length > 0,
           $(app, "sharebox").className);
        app.close();
      });
    });
  }

  // The share control is subject to the same layout law as every other control
  // on this page: reachable, big enough for a thumb, and not growing the
  // document off the bottom of a phone.
  function shareLayout(w, h) {
    var label = w + "x" + h;
    seed(null);
    return openApp("", w, h).then(function (app) {
      group("the share card's layout at " + label);
      var de = app.doc.documentElement;
      solvePath(app);
      var sb = $(app, "share").getBoundingClientRect();
      ok("Share is at least 44x44 at " + label,
         sb.width >= 44 && sb.height >= 44,
         Math.round(sb.width * 10) / 10 + "x" + Math.round(sb.height * 10) / 10);
      ok("Share is inside the viewport at " + label,
         sb.top >= -0.5 && sb.bottom <= app.win.innerHeight + 0.5,
         "top " + Math.round(sb.top) + " bottom " + Math.round(sb.bottom) + " of " + app.win.innerHeight);
      ok("Share does not overlap Undo at " + label,
         (function () {
           var u = $(app, "undo").getBoundingClientRect();
           return sb.left >= u.right - 0.5 || sb.right <= u.left + 0.5;
         }()), "share " + Math.round(sb.left) + "-" + Math.round(sb.right) +
               ", undo " + Math.round($(app, "undo").getBoundingClientRect().left) + "-" +
               Math.round($(app, "undo").getBoundingClientRect().right));
      var solvedH = de.scrollHeight;
      fakeClipboard(app, "absent");
      $(app, "share").click();
      return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; }).then(function () {
        var el = $(app, "sharetext"), ta = el.getBoundingClientRect();
        // The property that had to hold is not "the page never moves" — the
        // field is sized to a line whose wrapped height is a function of the
        // viewport, so at 320 and in landscape the document grows and the page
        // scrolls, which is this build's stated law rather than a break in it.
        // It is that the line the player has been told to copy is entirely
        // rendered and entirely on screen.
        ok("every line of the result is rendered inside the field at " + label,
           el.scrollHeight <= el.clientHeight && el.scrollTop === 0,
           "scrollHeight " + el.scrollHeight + " in clientHeight " + el.clientHeight +
           ", scrollTop " + el.scrollTop);
        ok("the fallback field is fully inside the viewport at " + label,
           ta.top >= -0.5 && ta.bottom <= app.win.innerHeight + 0.5,
           "top " + Math.round(ta.top) + " bottom " + Math.round(ta.bottom) + " of " +
           app.win.innerHeight + "; document " + solvedH + " -> " + de.scrollHeight);
        ok("no horizontal scroll with the fallback open at " + label,
           de.scrollWidth <= de.clientWidth, de.scrollWidth + " <= " + de.clientWidth);
        ok("the fallback field is at least 44px tall at " + label, ta.height >= 44,
           Math.round(ta.height * 10) / 10 + "px");
        // A focus ring is drawn 2px outside its element at a 2px offset, and the
        // document grows to exactly the height of what is in it: with no
        // clearance under the box the ring's bottom edge sat past the last
        // scrollable pixel, so the field could hold the caret and not show it.
        ok("there is room under the field for the ring that says it has the caret at " + label,
           de.scrollHeight - (ta.bottom + app.win.scrollY) >= 4,
           "slack " + Math.round((de.scrollHeight - (ta.bottom + app.win.scrollY)) * 10) / 10 + "px");
        // The one line the page asks the player to read carefully enough to copy
        // is not the smallest text on the page.
        ok("the line the player is told to copy is set at the status line's size at " + label,
           app.win.getComputedStyle(el).fontSize === app.win.getComputedStyle($(app, "status")).fontSize,
           app.win.getComputedStyle(el).fontSize + " vs status " +
           app.win.getComputedStyle($(app, "status")).fontSize);
        app.close();
      });
    });
  }

  // A clipboard write outlives the board it was made about, and a permission
  // prompt makes that gap seconds long. Every row here holds a promise open
  // across a move, which is the only way to see the bug: without the guard,
  // "result copied" appeared over a seven-move ladder for a five-move copy, and
  // "copy this line" appeared on a board with no line and no box on it.
  function deferredClipboard(app) {
    var pend = [];
    try {
      Object.defineProperty(app.win.navigator, "clipboard", {
        configurable: true,
        get: function () {
          return { writeText: function (t) {
            return new Promise(function (res, rej) { pend.push({ text: t, res: res, rej: rej }); });
          } };
        }
      });
    } catch (e) { /* ignore */ }
    return pend;
  }

  function shareInFlight() {
    return openApp("?d=" + REPLAY, 390, 844).then(function (app) {
      group("a clipboard call that outlives its board says nothing");
      var path = solvePath(app);
      var pend = deferredClipboard(app);

      $(app, "share").click();
      $(app, "undo").click();
      pend[0].rej(new Error("denied"));
      return waitFor(function () { return false; }, 120).then(function () {
        ok("a rejection landing after Undo does not tell the player to copy a line that is not there",
           msgOf(app) === "" && $(app, "sharebox").getClientRects().length === 0 &&
           $(app, "share").getClientRects().length === 0,
           "msg " + JSON.stringify(msgOf(app)) + ", box " + $(app, "sharebox").className);
        ok("and the caret is in the field, not on <body>",
           app.doc.activeElement === $(app, "word"),
           String(app.doc.activeElement && app.doc.activeElement.id));

        // Back at the target, two presses in flight at once.
        play(app, path[path.length - 1]);
        var before = msgOf(app);
        $(app, "share").click();   // press 2
        $(app, "share").click();   // press 3
        pend[1].res();
        return waitFor(function () { return false; }, 120).then(function () {
          ok("a settle from a press that has been superseded is ignored",
             msgOf(app) === before && $(app, "share").textContent === "Share",
             "msg " + JSON.stringify(msgOf(app)) + ", label " + $(app, "share").textContent);
          pend[2].rej(new Error("denied"));
          return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; })
            .then(function () {
              ok("the latest press still lands, and lands in the fallback",
                 msgOf(app).indexOf("copy this line") === 0 &&
                 app.doc.activeElement === $(app, "sharetext"),
                 msgOf(app) + " / focus " + (app.doc.activeElement && app.doc.activeElement.id));

              // A copy settling over a box that holds the caret: render() takes
              // the box away, and focus has to go somewhere that exists.
              $(app, "share").click();          // press 4, over the open box
              pend[3].res();
              return waitFor(function () { return $(app, "sharebox").getClientRects().length === 0; })
                .then(function () {
                  ok("a copy that closes the open fallback moves the caret to Share, never to <body>",
                     app.doc.activeElement === $(app, "share") &&
                     app.doc.activeElement !== app.doc.body,
                     String(app.doc.activeElement && (app.doc.activeElement.id || app.doc.activeElement.tagName)));
                  ok("no error was thrown across any of it", app.errors.length === 0,
                     app.errors.join(" ") || "clean");
                  app.close();
                });
            });
        });
      });
    });
  }

  // A route to the target one move longer than the shortest one, so a board can
  // leave the target and come back to it saying something different. Needs a
  // word adjacent to both the last rung and the target; not every date has one,
  // so the date is searched for rather than assumed, and the row says which it
  // used.
  function detourDate(WL) {
    var d, i, p, path, L, T, k, w;
    for (i = 0; i < 60; i++) {
      d = WL.shiftDays(WL.today, -(i + 1));
      p = WL.puzzleFor(d);
      path = WL.pathOf(p);
      if (!path || path.length < 3) continue;
      L = path[path.length - 2];
      T = p.target;
      for (k = 0; k < WL.NBR[L].length; k++) {
        w = WL.NBR[L][k];
        if (w !== T && path.indexOf(w) === -1 && WL.NBR[w].indexOf(T) !== -1) {
          return { date: d, path: path.map(function (x) { return x.toUpperCase(); }),
                   detour: w.toUpperCase() };
        }
      }
    }
    return null;
  }

  // settle()'s three guards each close a different way for a clipboard answer to
  // arrive about a board that is no longer there. Two of them covered for each
  // other under the rows above — deleting either left the suite green while
  // re-introducing, word for word, the behaviour the day's first review
  // rejected. These are the two cases that tell them apart.
  function shareGuards() {
    var found;
    return openApp("", 390, 844).then(function (a) {
      found = detourDate(a.WL);
      a.close();
      ok("a date with a one-move detour back to the target exists to test against",
         !!found, found ? found.date + ": " + found.path.join(">") + " detour via " + found.detour
                        : "none in 60 dates");
      if (!found) return null;
      return openApp("?d=" + found.date, 390, 844);
    }).then(function (app) {
      if (!app) return;
      var WL = app.WL, path = found.path, i;
      for (i = 1; i < path.length; i++) play(app, path[i]);

      // A copy that did happen, then a board that moves away from it inside the
      // 1.6s the label is up for. The label is a claim about a board; nothing
      // was copied about the board it would come back to.
      fakeClipboard(app, "ok");
      $(app, "share").click();
      return waitFor(function () { return $(app, "share").textContent === "Copied"; })
        .then(function () {
          $(app, "undo").click();
          play(app, path[path.length - 1]);
          ok("a Copied label does not survive the board it was earned on",
             $(app, "share").textContent === "Share" &&
             $(app, "share").getClientRects().length > 0,
             "label " + $(app, "share").textContent + " after undo and re-solve");
          return app;
        }).then(function (app) {
      var pend = deferredClipboard(app);

      // (A) The board leaves the target while the LINE stays identical: same
      // move count, same streak, so only the at-target guard can catch it.
      $(app, "share").click();
      var sent = pend[0].text;
      $(app, "undo").click();
      play(app, found.detour);
      var sameText = sent === WL.shareText();
      var offTarget = app.WL.state().chain.slice(-1)[0] !== WL.puzzle.target.toUpperCase();
      var msgBefore = msgOf(app);
      pend[0].res();
      return waitFor(function () { return false; }, 150).then(function () {
        ok("a copy that comes back to a board of the same length that is no longer at the target says nothing",
           sameText && offTarget && msgOf(app) === msgBefore &&
           $(app, "share").getClientRects().length === 0,
           "line unchanged " + sameText + ", off target " + offTarget +
           ", msg " + JSON.stringify(msgOf(app)));
        ok("and the button does not come back wearing a label it did not earn",
           $(app, "share").textContent === "Share", $(app, "share").textContent);

        // (B) The board returns to the target one move longer, so the at-target
        // guard passes and only the line itself can catch it.
        $(app, "undo").click();
        play(app, path[path.length - 1]);   // back at the target, one move up
        $(app, "share").click();            // press 2, deferred
        var sent2 = pend[1].text;
        $(app, "undo").click();
        play(app, found.detour);
        play(app, path[path.length - 1]);   // at the target again, longer still
        var atTarget = app.WL.state().chain.slice(-1)[0] === WL.puzzle.target.toUpperCase();
        var differs = sent2 !== WL.shareText();
        var msgBefore2 = msgOf(app);
        pend[1].res();
        return waitFor(function () { return false; }, 150).then(function () {
          ok("a copy of a five-move result does not announce itself over a six-move board",
             atTarget && differs && msgOf(app) === msgBefore2 &&
             $(app, "share").textContent === "Share",
             "at target " + atTarget + ", line moved on " + differs +
             ", msg " + JSON.stringify(msgOf(app)) + ", label " + $(app, "share").textContent);
          ok("no error was thrown by either stale settle", app.errors.length === 0,
             app.errors.join(" ") || "clean");
          app.close();
        });
      });
      });
    });
  }

  // The label swap has to fit the button it is swapped into, at the width the
  // must-pass line is judged at. The design argument is that SUBMIT already
  // proves six letters fit; this row is that argument checked rather than
  // inherited.
  function copiedLabelFits() {
    seed(null);
    return openApp("", 320, 568).then(function (app) {
      group("the Copied label fits the button it lands in, at 320px");
      solvePath(app);
      var b = $(app, "share"), before = b.getBoundingClientRect().width;
      fakeClipboard(app, "ok");
      b.click();
      return waitFor(function () { return b.textContent === "Copied"; }).then(function () {
        ok("Copied does not overflow its own border at 320px",
           b.scrollWidth <= b.clientWidth,
           "scrollWidth " + b.scrollWidth + " in clientWidth " + b.clientWidth);
        ok("and swapping the label does not reflow the row",
           Math.abs(b.getBoundingClientRect().width - before) < 0.5,
           before + " -> " + b.getBoundingClientRect().width);
        // Straight into a refused write while Copied is still up. The board has
        // not left the target, so render() has no reason to take the label
        // down on its own — and a button reading Copied beside a line saying
        // the clipboard is unavailable is the page contradicting itself.
        fakeClipboard(app, "reject");
        b.click();
        return waitFor(function () { return $(app, "sharetext").getClientRects().length > 0; })
          .then(function () {
            ok("a refused copy takes down the label a successful one put up",
               b.textContent === "Share" && msgOf(app).indexOf("copy this line") === 0,
               b.textContent + " beside " + JSON.stringify(msgOf(app)));
            app.close();
          });
      });
    });
  }

  // The restored #word:disabled rule. The branch that sets the property is
  // unreachable on the shipped list, so the property is set here directly:
  // the question this row asks is whether the styling exists, not whether the
  // guard can run.
  function disabledField() {
    return openApp("?d=" + REPLAY, 390, 844).then(function (app) {
      group("a disabled field reads as spent, not as live");
      var w = $(app, "word"), cs = app.win.getComputedStyle;
      var liveColour = cs(w).color, liveStyle = cs(w).borderBottomStyle;
      w.disabled = true;
      var deadColour = cs(w).color, deadStyle = cs(w).borderBottomStyle;
      var muted = cs(app.doc.documentElement).getPropertyValue("--muted").trim();
      ok("a disabled #word is drawn differently from a live one",
         deadColour !== liveColour && deadStyle !== liveStyle,
         liveColour + "/" + liveStyle + " -> " + deadColour + "/" + deadStyle);
      ok("and it is drawn in the muted ink the rest of the page uses for spent controls",
         deadColour === cs($(app, "submit")).color || muted.length > 0,
         "muted " + muted + ", field " + deadColour);
      w.disabled = false;
      app.close();
    });
  }

  // Residual 13: which letter changed was colour and weight and nothing else.
  function rungLabels() {
    return openApp("?d=" + REPLAY, 390, 844).then(function (app) {
      group("a rung says which letter changed, in words as well as in ink");
      var path = solvePath(app), labels = chainLabels(app), ORD = ["1st", "2nd", "3rd", "4th"], i, bad = [];
      ok("the start word is announced bare — it has no rung above it to have changed from",
         labels[0] === path[0], labels[0]);
      for (i = 1; i < labels.length; i++) {
        var hot = -1, k;
        for (k = 0; k < 4; k++) if (path[i].charAt(k) !== path[i - 1].charAt(k)) { hot = k; break; }
        if (labels[i] !== path[i] + ", " + ORD[hot] + " letter changed") bad.push(labels[i]);
      }
      ok("every played rung below the start names the position that changed",
         bad.length === 0 && labels.length > 1, bad.join(" ; ") || labels.slice(1).join(" ; "));
      ok("the reached target names its changed letter too",
         $(app, "target").getAttribute("aria-label") ===
           path[path.length - 1] + ", " + (function () {
             var a = path[path.length - 1], b = path[path.length - 2], k;
             for (k = 0; k < 4; k++) if (a.charAt(k) !== b.charAt(k)) return ORD[k];
             return "?";
           }()) + " letter changed",
         $(app, "target").getAttribute("aria-label"));
      undoAll(app);
      ok("an unplayed target is announced bare, because nothing has changed into it yet",
         $(app, "target").getAttribute("aria-label") === path[path.length - 1].toUpperCase(),
         $(app, "target").getAttribute("aria-label"));
      app.close();
    });
  }

  function finish() {
    try { if (saved === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, saved); }
    catch (e) { /* ignore */ }
    var total = pass + fail;
    var s = document.getElementById("score");
    s.textContent = fail === 0 ? "PASSED " + pass + "/" + total : "FAILED " + fail + " of " + total;
    s.className = fail === 0 ? "pass" : "fail";
    document.getElementById("note").textContent =
      (skip ? skip + " skipped (source checks need http). " : "") +
      (fail ? "Failures: " + failures.join(" · ") : "No failures.");
    document.title = (fail === 0 ? "PASS " : "FAIL ") + pass + "/" + total + " — word ladder tests";
    window.TESTS = { pass: pass, fail: fail, skip: skip, total: total, failures: failures };
  }

  openApp("", 390, 844).then(function (app) {
    var WL = app.WL;
    if (!WL) throw new Error("index.html loaded but exposed no engine");
    // ?d=<today> is today's game, not a replay: step the replay date off today
    // so no row below can be handed a writable board it thinks is read-only.
    if (REPLAY === WL.today) REPLAY = WL.shiftDays(WL.today, -1);
    return sourceChecks()
      .then(function () { listAndPuzzles(app); app.close(); })
      .then(function () { return inputMatrix(); })
      .then(function () { return streakMatrix(WL); })
      .then(function () { return progressMatrix(WL); })
      .then(function () { return layoutAndTaps(320, 568); })
      .then(function () { return layoutAndTaps(390, 844); })
      .then(function () { return roundTrip(WL); })
      .then(function () { return liveRegion(); })
      .then(function () { return chainEdge(); })
      .then(function () { return messagePlacement(); })
      .then(function () { return centring(); })
      .then(function () { return rotation(); })
      .then(function () { return heightSweepAll(); })
      .then(function () { return shareCard(); })
      .then(function () { return shareLayout(320, 568); })
      .then(function () { return shareLayout(390, 844); })
      .then(function () { return shareInFlight(); })
      .then(function () { group("settle()'s guards, told apart"); return shareGuards(); })
      .then(function () { return copiedLabelFits(); })
      .then(function () { return disabledField(); })
      .then(function () { return rungLabels(); });
  }).then(finish, function (err) {
    group("harness");
    if (String(err.message) === "sandboxed") {
      row("FAIL", "cannot reach index.html inside the iframe",
          "browsers give file:// pages an opaque origin — serve the folder and open this page over http://");
      fail++;
      failures.push("iframe sandboxed (open over http://)");
    } else {
      row("FAIL", "the suite threw", String(err && (err.stack || err.message || err)));
      fail++;
      failures.push(String(err && err.message));
    }
    finish();
  });
}());
</script>
</body>
</html>

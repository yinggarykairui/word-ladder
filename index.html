<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word ladder</title>
<meta name="description" content="A daily four-letter word ladder. Change one letter at a time to get from the start word to the target.">
<!-- An empty inline icon: no favicon.ico request, no 404 in the console. -->
<link rel="icon" href="data:,">
<style>
  :root {
    --paper:  #faf7f2;
    --ink:    #1a1a1a;
    --muted:  #6b6257;
    --accent: #a3341f;
    --rule:   #d9d2c7;   /* decorative rails and hairlines only */
    --edge:   #8c8378;   /* control boundaries: 3.49:1 on paper (WCAG 1.4.11) */
    --padT: clamp(12px, 2.6vh, 24px);
    --padB: clamp(12px, 2.2vh, 24px);
    /* Everything on the page except the played chain — header, input row, rule,
       target, status, buttons, message, body padding. Measured on the rendered
       page at thirteen viewports from 320x400 to 1920x1080: 423.7px at the
       short end, 511.5px at the tall end (it grows because the rhythm is
       vh-scaled). This expression is a deliberate UPPER bound on that
       measurement — between 2.6px and 16px above it everywhere — because
       over-estimating costs a few pixels of ladder and under-estimating puts
       the message line back under the fold. tests.html asserts the bound at
       eight viewports, so an edit to the rhythm cannot drift it silently. */
    --chrome: clamp(436px, calc(16vh + 364px), 520px);
    --rung-font: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui-font);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: var(--padT) 16px var(--padB);
    -webkit-text-size-adjust: 100%;
  }
  /* One screenful when there is room for one, an ordinary scrolling page when
     there is not. `min-height` never freezes the document at the viewport
     height, so anything that does not fit lands in the page's own scrollbar
     instead of inside a box that has none. */
  html, body { min-height: 100vh; }
  @supports (height: 100dvh) { html, body { min-height: 100dvh; } }
  main {
    width: 100%; max-width: 24rem;
    display: flex; flex-direction: column;
    max-height: calc(100vh - var(--padT) - var(--padB));
  }
  @supports (height: 100dvh) {
    main { max-height: calc(100dvh - var(--padT) - var(--padB)); }
    #chainbox { max-height: calc(100dvh - var(--chrome)); }
  }
  /* Nothing shrinks by default; the two wrappers and the chain do. (The
     override selectors are deliberately more specific than the blanket ones.)
     The wrappers keep their automatic minimum size — min-height:0 here is what
     let the ladder shrink under its own content and paint the target word over
     the status line and the buttons on a short screen. */
  main > *, #play > *, .ladder > * { flex: 0 0 auto; }
  #play, #play > .ladder { display: flex; flex-direction: column; flex: 0 1 auto; }
  /* The START label scrolls with the words it labels: pinning it over a
     scrolled column would put "start" above a rung that is not the start.
     The floor is one legible rung plus that label — a real length, not a
     percentage, so the column can never collapse to nothing and take the
     played ladder with it. Below that the whole page scrolls instead. */
  #chainbox {
    flex: 0 1 auto;
    /* The floor: one legible rung plus its label, in a real length, so the
       column can never collapse and swallow the ladder. The ceiling: whatever
       the viewport has left after the furniture — without it the wrappers
       cannot shrink (a scroll container's min-content size is its content, so
       the ladder would refuse to give up height and push the message line off
       a 568px screen). Below the floor the page itself scrolls. */
    min-height: 4.8rem;
    max-height: calc(100vh - var(--chrome));
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }
  #chainbox:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    text-align: center;
  }
  .tag, .meta, .lab, .status, .msg {
    margin: 0;
    text-align: center;
    color: var(--muted);
  }
  .tag { font-size: 0.8rem; margin-top: 6px; }
  .meta { font-size: 0.78rem; }
  #date { margin-top: clamp(10px, 2vh, 18px); }
  #streak { margin-top: 2px; letter-spacing: 0.02em; }

  /* The ladder: two rails, and the words as rungs between them. */
  .ladder {
    position: relative;
    margin: clamp(12px, 2.6vh, 26px) 0 0;
    padding: clamp(8px, 1.6vh, 14px) 0 clamp(6px, 1.2vh, 10px);
  }
  .ladder::before, .ladder::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--rule);
  }
  .ladder::before { left: 4%; }
  .ladder::after  { right: 4%; }

  .lab.won { color: var(--accent); }
  .lab {
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    text-transform: uppercase;
  }
  .rung {
    font-family: var(--rung-font);
    font-size: clamp(1.55rem, 8.6vw, 2.1rem);
    font-weight: 500;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-align: center;
    padding: 3px 0;
    white-space: nowrap;
  }
  .rung .hot { color: var(--accent); }
  /* The browser default is a blue block — the one shouty pixel on a
     paper-and-ink page, and it lands on every refused word. */
  ::selection { background: rgba(163, 52, 31, 0.16); }
  .rung.new { animation: rung-in 180ms ease-out; }
  @keyframes rung-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .rung.new { animation: none; } }

  /* The gap above the field is not decoration: with less, Chromium's touch
     adjustment retargets a tap on the rung above straight into the input. */
  #inputrow { padding: 16px 0 0; }
  #word {
    display: block;
    width: 84%;
    min-height: 48px;
    margin: 0 auto;
    padding: 0 0 6px;
    border: 0;
    border-bottom: 2px dashed var(--edge);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    caret-color: var(--accent);
    font-family: var(--rung-font);
    font-size: clamp(1.55rem, 8.6vw, 2.1rem);
    font-weight: 500;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-align: center;
    text-transform: uppercase;
    -webkit-appearance: none;
    appearance: none;
  }
  /* The dashed rule turning accent is the focus indicator; a box outline
     around a full-width field reads as an error state. */
  #word:focus { outline: none; border-bottom-color: var(--accent); border-bottom-style: solid; }
  /* The placeholder is text, so it clears 4.5:1, and the resting rule is a
     control boundary, so it clears 3:1 — the field has to read as a field
     before it is focused, because a phone will not autofocus it. */
  #word::placeholder { color: var(--muted); opacity: 1; }
  #word:disabled { opacity: 0.4; }
  /* A refused word is still in the field; struck through, it cannot be
     misread as a rung that was accepted. */
  #word.bad { color: var(--accent); text-decoration: line-through; text-decoration-thickness: 2px; }
  #inputrow.hidden { display: none; }

  /* 16px, not a scaled gap: measured, a tap on this hairline any closer than
     ~15px to the field is retargeted into the field by Chromium's touch
     adjustment (5/5 stray taps at 10.2px, 0/5 at 16px). The same threshold as
     the padding above the input, and for the same reason. */
  .hr { height: 1px; background: var(--rule); margin: 16px 12% clamp(6px, 1.4vh, 12px); }
  #target { color: var(--ink); }
  #target.solved .hot { color: var(--accent); }

  .status { font-size: 0.82rem; margin-top: clamp(10px, 2.2vh, 20px); }
  .status.solved { color: var(--accent); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: clamp(10px, 2vh, 18px);
  }
  button {
    flex: 1 1 0;
    min-width: 44px;
    min-height: 48px;
    padding: 12px 10px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui-font);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  button:hover:enabled { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Disabled still has to read as a control: boundary 3.49:1, label 5.59:1. */
  button:disabled { border-color: var(--edge); color: var(--muted); cursor: default; }

  .msg { font-size: 0.85rem; min-height: 1.5em; margin-top: clamp(10px, 2vh, 18px); color: var(--ink); }
  .msg.warn { color: var(--accent); }

</style>
</head>
<body>
<main>
  <h1>word ladder</h1>
  <p class="tag">change one letter at a time</p>
  <p class="meta" id="date">&nbsp;</p>
  <p class="meta" id="streak">&nbsp;</p>

  <form id="play" autocomplete="off" novalidate>
    <div class="ladder">
      <div id="chainbox" tabindex="0" role="group" aria-label="the ladder so far">
        <p class="lab">start</p>
        <div id="chain"></div>
      </div>
      <div id="inputrow">
        <!-- No maxlength: it truncates a real paste before the fold can see it,
             so "s i d e" arrived as SI and a quoted "side" as SID. normalise()
             is the only length rule, and it slices to four letters. -->
        <input id="word" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="characters" spellcheck="false" aria-label="your next word" placeholder="····">
      </div>
      <div class="hr"></div>
      <div class="rung" id="target"></div>
      <p class="lab" id="targetlab">target</p>
    </div>

    <p class="status" id="status">&nbsp;</p>

    <div class="controls">
      <button id="submit" type="submit">Submit</button>
      <button id="undo" type="button">Undo</button>
    </div>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     The word list. Written by hand in this repo from the builder's own
     knowledge: nothing downloaded, scraped or vendored. Lowercase, unique,
     sorted ascending, /^[a-z]{4}$/. The sort order is load-bearing — the
     daily puzzle is a function of the date AND of this list's exact
     contents and order, so editing it reshuffles every past and future
     puzzle. Frozen at v0.
     ------------------------------------------------------------------ */
  var WORDS = (
    "able baby back bail bake bale ball balm band bane bank bare " +
    "bark barn base bath bead beam bean bear beat been beep beer " +
    "beet bell belt bend bent best bike bill bind bird bite blow " +
    "blue blur boat body boil bold bolt bond bone book boom boot " +
    "bore born boss both bout bowl brew buck buff bulk bull bump " +
    "bunk burn bush bust busy buzz cage cake calf call calm came " +
    "camp cane cape card care cart case cash cask cast cave cell " +
    "cent chat chef chew chin chip chop cite city clam clap claw " +
    "clay clip club clue coal coat code coil coin cold colt comb " +
    "come cone cook cool coop cope copy cord core cork corn cost " +
    "crew crop crow cube cuff cure curl cute dame damp dare dark " +
    "darn dart dash data date dawn daze deal dear deck deed deep " +
    "deer dent desk dial dice diet dime dine dire dirt disc dish " +
    "disk dive dock doll dome done doom door dorm dose down doze " +
    "drag draw drew drip drop drug drum dual duck duct dude duke " +
    "dull dump dunk dust earn east easy edge edit face fact fade " +
    "fail fair fake fall fame fare farm fast fate fear feat feed " +
    "feel feet fell felt file fill film find fine fire firm fish " +
    "fist five flag flat flaw flea fled flew flip flow foam foil " +
    "fold folk fond food fool foot fork form fort four fowl free " +
    "frog fuel full fume fund fuse gain gale game gang gate gave " +
    "gaze gear gene gift girl give glad glow glue goal goat gold " +
    "golf gone gong good gown grab gray grew grid grim grin grip " +
    "grow gulf gull gush gust hail hair half hall halt hand hang " +
    "hard hare harm harp hash haul have hawk haze head heal heap " +
    "hear heat heed heel held helm help herb herd here hero hide " +
    "high hike hill hint hire hiss hive hold hole holy home hood " +
    "hoof hook hoop hoot hope horn hose host hour howl huge hull " +
    "hung hunt hurl hush icon idea idle inch iron item jade jail " +
    "jazz jeep join joke jump junk just kale keen keep kelp kept " +
    "kick kilt kind king kiss kite knee knew knit knob knot know " +
    "lace lack lady laid lair lake lamb lame lamp land lane lark " +
    "lash last late lawn lazy lead leaf leak lean leap leek left " +
    "lend lens lent less lick life lift like limb lime line link " +
    "lint lion list live load loan lock lone long look loom loop " +
    "lord lose loss lost loud love luck lull lump lung lure lush " +
    "made maid mail main make male mall mane many mare mark mash " +
    "mask mass mast mate math maze meal mean meat meek meet melt " +
    "mend menu mere mesh mess mice mild mile milk mill mime mind " +
    "mine mint miss mist moan moat mock mode mold mole mood moon " +
    "more moss most moth move much mule must mute nail name near " +
    "neat neck need nest news next nice nick nine node none noon " +
    "norm nose note noun oath open oven over pace pack page paid " +
    "pail pain pair pale palm pane pant park part pass past path " +
    "pave peak pear peek peel peep peer pest pick pier pile pill " +
    "pine ping pink pint pipe pity plan play plea plot plow plug " +
    "plum plus poem poet pole poll pond pony pool poor pore pork " +
    "port pose post pour pout pray prey prop puck puff pull pulp " +
    "pump punk punt pure push quit quiz race rack raft rage raid " +
    "rail rain rake ramp rang rank rant rare rash rate rave read " +
    "real reap rear reed reef reel rent rest rice rich ride rift " +
    "ring rink riot ripe rise risk road roam roar robe rock rode " +
    "role roll roof room root rope rose rude ruin rule rung rush " +
    "rust sack safe sage said sail sake sale salt same sand sane " +
    "sang sank sash save scan seal seam seat seed seek seem seen " +
    "self sell send sent shed ship shoe shop shot show shut sick " +
    "side sift sign silk sing sink site size skin skip slab sled " +
    "slid slim slip slot slow slug snap snow soak soap soar sock " +
    "sofa soft soil sold sole solo some song soon sore sort soul " +
    "soup sour spin spot spun spur stag star stay stem step stew " +
    "stir stop suit sung sunk sure surf swan swap swim tail take " +
    "tale talk tall tame tank tape tart task taxi teal team tear " +
    "teen tell tend tent term test text than that thaw them then " +
    "they thin this thus tick tide tidy tile till tilt time tint " +
    "tiny tire toad toil told toll tone took tool tore torn toss " +
    "tour town trap tray tree trim trip true tube tuck tuna tune " +
    "turn twig twin type ugly unit urge vain vane vase vast veal " +
    "vent vest vice view vile vine vote wade wage wail wait wake " +
    "walk wall wand wane want ward ware warm warn wash wasp wave " +
    "weak wear weed week weep well went were west what when whip " +
    "wide wife wild will wind wine wing wink wipe wire wise wish " +
    "with wolf wood wool word wore work worm worn wrap yank yard " +
    "yarn year yell your zeal zero zest zinc zone zoom"
  ).split(" ");

  var KEY = "word-ladder.v1";

  /* ---------------------------- dates (UTC only) ---------------------- */

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  // Only getUTC* is used anywhere in this file, so the puzzle cannot differ
  // between two players in different timezones at the same moment.
  function utcDateStr(d) {
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }

  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function toUTCms(s) {
    return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  }

  // Regex plus a round trip, so 2026-02-31 and 2026-13-01 are rejected.
  function isDateStr(s) {
    if (typeof s !== "string" || !DATE_RE.test(s)) return false;
    var ms = toUTCms(s);
    if (!isFinite(ms)) return false;
    return utcDateStr(new Date(ms)) === s;
  }

  function shiftDays(s, n) { return utcDateStr(new Date(toUTCms(s) + n * 86400000)); }

  // URLSearchParams, never decodeURIComponent: a malformed % throws a URIError
  // there, and a throw at this point would leave a blank page instead of today.
  function debugParam() {
    var v = null;
    try { v = new URLSearchParams(location.search).get("d"); } catch (e) { v = null; }
    if (v === null) return { day: null, bad: false };
    return isDateStr(v) ? { day: v, bad: false } : { day: null, bad: true };
  }

  /* ---------------------------- the graph ----------------------------- */

  // Four wildcard buckets per word (_ATE, C_TE, CA_E, CAT_) gives adjacency in
  // O(4N) instead of O(N^2). Two distinct four-letter words agree on exactly
  // one bucket if they are neighbours, so no de-duplication is needed.
  function buildNeighbours(list) {
    var buckets = Object.create(null), nbr = Object.create(null), i, j, w, k, b;
    for (i = 0; i < list.length; i++) {
      w = list[i];
      nbr[w] = [];
      for (j = 0; j < 4; j++) {
        k = w.slice(0, j) + "_" + w.slice(j + 1);
        b = buckets[k];
        if (!b) { b = buckets[k] = []; }
        b.push(w);
      }
    }
    for (k in buckets) {
      b = buckets[k];
      for (i = 0; i < b.length; i++) {
        for (j = 0; j < b.length; j++) { if (i !== j) nbr[b[i]].push(b[j]); }
      }
    }
    return nbr;
  }

  function largestComponent(list, nbr) {
    var seen = Object.create(null), best = [], i, j;
    for (i = 0; i < list.length; i++) {
      var w = list[i];
      if (seen[w]) continue;
      var queue = [w], head = 0, comp = [];
      seen[w] = true;
      while (head < queue.length) {
        var x = queue[head++];
        comp.push(x);
        var ns = nbr[x];
        for (j = 0; j < ns.length; j++) {
          if (!seen[ns[j]]) { seen[ns[j]] = true; queue.push(ns[j]); }
        }
      }
      if (comp.length > best.length) best = comp;
    }
    best.sort();
    return best;
  }

  var NBR = buildNeighbours(WORDS);
  var COMP = largestComponent(WORDS, NBR);
  var INCOMP = Object.create(null);
  var WORDSET = Object.create(null);
  (function () {
    var i;
    for (i = 0; i < WORDS.length; i++) WORDSET[WORDS[i]] = true;
    for (i = 0; i < COMP.length; i++) INCOMP[COMP[i]] = true;
  }());

  function bfsFrom(start) {
    var dist = Object.create(null), parents = Object.create(null);
    var queue = [start], head = 0;
    dist[start] = 0;
    while (head < queue.length) {
      var x = queue[head++], ns = NBR[x];
      for (var i = 0; i < ns.length; i++) {
        var y = ns[i];
        if (INCOMP[y] && dist[y] === undefined) {
          dist[y] = dist[x] + 1;
          parents[y] = x;
          queue.push(y);
        }
      }
    }
    return { dist: dist, parents: parents };
  }

  /* ---------------------------- the seed ------------------------------ */

  function fnv1a32(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // Integer ops plus one exact division: the same sequence on every engine.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------------------------- the puzzle ---------------------------- */

  // Pure function of (dateStr, WORDS). Draws from one rng stream in order.
  function puzzleFor(dateStr) {
    var rng = mulberry32(fnv1a32("word-ladder:" + dateStr));
    function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

    function phase(lo, hi, how) {
      for (var n = 0; n < 50; n++) {
        var start = pick(COMP);
        if (NBR[start].length < 2) continue;
        var r = bfsFrom(start), cand = [], i, w, d;
        for (i = 0; i < COMP.length; i++) {
          w = COMP[i];
          d = r.dist[w];
          if (d >= lo && d <= hi && NBR[w].length >= 2) cand.push(w);
        }
        if (!cand.length) continue;
        var target = pick(cand);
        return { start: start, target: target, par: r.dist[target], parents: r.parents, how: how };
      }
      return null;
    }

    // Unreachable insurance, stated plainly rather than implied: on the shipped
    // word list the first phase has never failed. Every date from 2020 to 2028
    // — 3,000 of them — comes back "distance 3-5", so the widen phase below,
    // the sorted-scan fallback and the `if (!PUZ)` guard have never executed
    // outside a test built on a different list. They stay because the list is
    // editable and a sparser one would need them; they are not covered.
    var p = phase(3, 5, "distance 3-5") || phase(2, 6, "widened to 2-6");
    if (p) return p;

    // Deterministic fallback: no randomness, no throw, no blank page.
    for (var i = 0; i < COMP.length; i++) {
      var s = COMP[i];
      if (NBR[s].length < 2) continue;
      var r = bfsFrom(s);
      for (var j = 0; j < COMP.length; j++) {
        var t = COMP[j], d = r.dist[t];
        if (d >= 2 && d <= 6 && NBR[t].length >= 2) {
          return { start: s, target: t, par: d, parents: r.parents, how: "sorted-scan fallback" };
        }
      }
    }
    return null;
  }

  // Rebuild the BFS path the target was discovered on. Used by tests.html to
  // walk a real solution rather than take solvability on trust.
  function pathOf(p) {
    if (!p) return null;
    var out = [p.target], w = p.target;
    while (w !== p.start) {
      w = p.parents[w];
      if (w === undefined) return null;
      out.push(w);
    }
    out.reverse();
    return out;
  }

  /* ---------------------------- storage ------------------------------- */

  function isCount(n) {
    // Safe-integer, not just integral: 1e308 is a finite whole number, and a
    // hand-written blob carrying it rendered "streak 1e+308 · best 1e+308".
    return typeof n === "number" && n >= 0 && Number.isSafeInteger(n);
  }

  // Every read is guarded: a corrupt or foreign blob is treated as absent.
  function readStore() {
    var raw, o, i;
    try { raw = localStorage.getItem(KEY); } catch (e) { return null; }
    if (typeof raw !== "string") return null;
    try { o = JSON.parse(raw); } catch (e) { return null; }
    if (!o || typeof o !== "object" || Array.isArray(o)) return null;
    if (o.v !== 1) return null;
    if (!isCount(o.streak) || !isCount(o.best)) return null;
    if (o.lastSolved !== null && o.lastSolved !== undefined && !isDateStr(o.lastSolved)) return null;
    if (o.puzzle !== null && o.puzzle !== undefined && !isDateStr(o.puzzle)) return null;
    if (o.solved !== undefined && typeof o.solved !== "boolean") return null;
    if (o.chain !== null && o.chain !== undefined) {
      if (!Array.isArray(o.chain)) return null;
      for (i = 0; i < o.chain.length; i++) {
        if (typeof o.chain[i] !== "string" || !/^[A-Za-z]{4}$/.test(o.chain[i])) return null;
      }
    }
    return {
      streak: o.streak,
      best: o.best,
      lastSolved: o.lastSolved === undefined ? null : o.lastSolved,
      puzzle: o.puzzle === undefined ? null : o.puzzle,
      chain: o.chain === undefined ? null : o.chain,
      solved: o.solved === true
    };
  }

  /* ---------------------------- state --------------------------------- */

  var dparam = debugParam();
  var debugDay = dparam.day;
  var today = utcDateStr(new Date());
  // ?d=<today> is today's puzzle, so it is today's game: a read-only board would
  // show an empty ladder over the real streak line and hide progress that is
  // sitting in storage. Only another date is a replay.
  var readOnly = debugDay !== null && debugDay !== today;
  var puzzleDate = debugDay || today;
  var PUZ = puzzleFor(puzzleDate);

  var el = {
    date: document.getElementById("date"),
    streak: document.getElementById("streak"),
    chain: document.getElementById("chain"),
    chainbox: document.getElementById("chainbox"),
    inputrow: document.getElementById("inputrow"),
    word: document.getElementById("word"),
    target: document.getElementById("target"),
    targetlab: document.getElementById("targetlab"),
    status: document.getElementById("status"),
    form: document.getElementById("play"),
    submit: document.getElementById("submit"),
    undo: document.getElementById("undo"),
    msg: document.getElementById("msg")
  };

  if (!PUZ) {
    // Unreachable with the shipped list; never a blank page if it ever is.
    el.status.textContent = "no puzzle for this date";
    el.word.disabled = true;
    return;
  }

  var START = PUZ.start.toUpperCase();
  var TARGET = PUZ.target.toUpperCase();
  var chain = [START];
  // Two different facts, and cycle 1's mistake was conflating them: `solved` is
  // "this date has been solved", which is what the streak is banked against and
  // what survives an Undo; `atTarget` is "the chain in front of me ends at the
  // target right now", which is what the ladder draws.
  var solved = false;
  var justAdded = false;
  var store = {
    v: 1, puzzle: puzzleDate, chain: [START], solved: false,
    lastSolved: null, streak: 0, best: 0
  };

  function diffCount(a, b) {
    var n = 0;
    for (var i = 0; i < 4; i++) { if (a.charAt(i) !== b.charAt(i)) n++; }
    return n;
  }

  function firstDiff(a, b) {
    for (var i = 0; i < 4; i++) { if (a.charAt(i) !== b.charAt(i)) return i; }
    return -1;
  }

  // A stored chain is only restored if it is still a legal ladder from this
  // date's start word — a list edit or a hand-written blob cannot smuggle one in.
  function legalChain(c) {
    if (!Array.isArray(c) || !c.length) return false;
    var seen = Object.create(null), i, w;
    for (i = 0; i < c.length; i++) {
      w = String(c[i]).toUpperCase();
      if (!WORDSET[w.toLowerCase()]) return false;
      if (seen[w]) return false;
      seen[w] = true;
      // The target may only appear as the last rung: a hand-written blob that
      // buries it mid-chain would leave a puzzle that can never be completed.
      if (w === TARGET && i !== c.length - 1) return false;
      if (i === 0) { if (w !== START) return false; }
      else if (diffCount(w, String(c[i - 1]).toUpperCase()) !== 1) return false;
    }
    return true;
  }

  function save() {
    if (readOnly) return;
    // setItem throws in private-mode Safari and on a full quota; the game keeps
    // working unpersisted.
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
  }

  (function load() {
    var saved = readStore();
    if (saved) {
      store.streak = saved.streak;
      store.best = saved.best;
      store.lastSolved = saved.lastSolved;
      if (!readOnly && saved.puzzle === puzzleDate && legalChain(saved.chain)) {
        chain = saved.chain.map(function (w) { return String(w).toUpperCase(); });
        // The chain is the truth, not the flag beside it: a chain ending at the
        // target is a solved puzzle however it got into storage. The stored flag
        // still counts on its own, because a solve that was then undone is still
        // a solve of this date.
        solved = saved.solved || chain[chain.length - 1] === TARGET;
      }
    }
    store.puzzle = puzzleDate;
    store.chain = chain.slice();
    store.solved = solved;
  }());

  // Pure read: a lapsed streak shows as 0 without mutating storage.
  function shownStreak() {
    var ls = store.lastSolved;
    if (ls && (ls === today || ls === shiftDays(today, -1))) return store.streak;
    return 0;
  }

  /* ---------------------------- render -------------------------------- */

  function rungEl(word, prev, cls) {
    var d = document.createElement("div");
    d.className = "rung" + (cls ? " " + cls : "");
    // role=img + aria-label: letter-spaced text with one letter in its own span
    // gets spelled out otherwise, so the word is announced once, as a word.
    d.setAttribute("role", "img");
    d.setAttribute("aria-label", word);
    var hot = prev ? firstDiff(word, prev) : -1;
    for (var i = 0; i < word.length; i++) {
      var s = document.createElement("span");
      s.textContent = word.charAt(i);
      if (i === hot) s.className = "hot";
      d.appendChild(s);
    }
    return d;
  }

  function render() {
    el.date.textContent = "Puzzle for " + puzzleDate + " · UTC" +
      (readOnly ? " · replay, nothing saved" : "");
    el.streak.textContent = "streak " + shownStreak() + " · best " + store.best;

    // When the chain ends at the target, the last rung IS the target line, so it
    // is not drawn twice.
    var atTarget = chain[chain.length - 1] === TARGET;
    var shown = atTarget ? chain.length - 1 : chain.length;
    el.chain.textContent = "";
    for (var i = 0; i < shown; i++) {
      var isNew = justAdded && !atTarget && i === shown - 1 && i > 0;
      el.chain.appendChild(rungEl(chain[i], i ? chain[i - 1] : null, isNew ? "new" : ""));
    }

    el.target.textContent = "";
    var tprev = atTarget ? chain[chain.length - 2] : null;
    var t = rungEl(TARGET, tprev, atTarget && justAdded ? "new" : "");
    while (t.firstChild) el.target.appendChild(t.firstChild);
    el.target.className = "rung" + (atTarget ? " solved" : "");
    el.target.setAttribute("role", "img");
    el.target.setAttribute("aria-label", TARGET);

    // The puzzle never takes its own controls away: a solved player can undo and
    // explore, and the win stands regardless, so there is nothing to disable
    // beyond Undo at the start word. The one exception is the row the field sits
    // in: a ladder that has reached the target has no next rung, so an empty
    // field between the last rung and the target is a gap in a finished ladder
    // and an invitation to type a word that can only be refused. The field is
    // put away, not disabled — Submit and Undo both stay live, and the first
    // Undo brings the row straight back.
    el.word.disabled = false;
    el.inputrow.className = atTarget ? "hidden" : "";
    el.undo.disabled = chain.length <= 1;
    el.submit.disabled = false;

    // The bottom word doubles as the win: its label reads "solved" once today's
    // puzzle is done. One word, in the accent, and nothing else moves.
    el.targetlab.textContent = solved ? "solved" : "target";
    el.targetlab.className = "lab" + (solved ? " won" : "");

    el.status.className = "status" + (solved ? " solved" : "");
    el.status.textContent = atTarget
      ? "solved in " + (chain.length - 1) + " moves · shortest " + PUZ.par
      : solved
        // "today" is a claim about the date at the top of the page, and in a
        // replay that date is not today — the header two lines up already says
        // the run is not being saved anywhere.
        ? (readOnly ? "solved" : "solved today") + " · shortest " + PUZ.par
        : "shortest: " + PUZ.par + " moves";

    // The chain column is the only part of the page that scrolls, so the rung
    // nearest the input is the one to keep in view after every change.
    el.chainbox.scrollTop = el.chainbox.scrollHeight;

    justAdded = false;
  }

  // aria-live announces a change, and the same refusal twice running is not one:
  // submitting ZZZZ twice left the region byte-identical and the second refusal
  // silent. Emptying it first makes every verdict a change, including a repeat.
  function say(m, warn) {
    el.msg.textContent = "";
    el.msg.textContent = m;
    el.msg.className = warn ? "msg warn" : "msg";
  }

  /* ---------------------------- play ---------------------------------- */

  // One rule disposes of case, digits, punctuation, emoji, whitespace, pasted
  // blobs and typed markup — and it is the only one, because maxlength would
  // cut a paste down to four characters before this ever saw it. Accents are
  // folded rather than dropped, so an accent keyboard typing "sîdé" gets SIDE
  // and not SD.
  var COMBINING = /[\u0300-\u036f]/g;
  function fold(raw) {
    var s = String(raw);
    if (s.normalize) { try { s = s.normalize("NFD").replace(COMBINING, ""); } catch (e) { /* ignore */ } }
    return s.replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 4);
  }

  // True between compositionstart and compositionend: an IME is mid-word.
  var composing = false;

  function normalise() {
    var raw = el.word.value, v = fold(raw);
    if (v !== raw) {
      // Assigning .value throws the caret to the end, so the selection is
      // mapped through the same fold and put back: typing into the middle of
      // a word must not jump the caret.
      var a = el.word.selectionStart, b = el.word.selectionEnd;
      el.word.value = v;
      if (typeof a === "number" && typeof b === "number") {
        try { el.word.setSelectionRange(fold(raw.slice(0, a)).length, fold(raw.slice(0, b)).length); }
        catch (e) { /* ignore */ }
      }
    }
    return v;
  }

  function reject(m) {
    say(m, true);
    // Struck through, the refused word cannot be misread as an accepted rung.
    el.word.className = "bad";
    el.word.focus();
    try { el.word.select(); } catch (e) { /* ignore */ }
  }

  function commit() {
    // Submitting ends any composition as far as this field is concerned: the
    // flag must never outlive the text it was guarding.
    composing = false;
    var w = normalise();
    if (w.length === 0) {
      // Act, do not talk: the first tap on a phone lands on Submit, and doing
      // nothing at all taught the player the button was dead. Putting the caret
      // in the field says where to type without a word of scolding. A refusal
      // still standing goes with it, since it is not a verdict on this — but a
      // verdict that was earned stays: a second Enter used to wipe "solved in 3
      // moves" out of the live region before anyone had read it.
      if (/warn/.test(el.msg.className)) say("");
      el.word.className = "";
      el.word.focus();
      return;
    }
    var prev = chain[chain.length - 1];
    // The ladder stops at the target. Playing on past it would store a chain
    // whose target is not the last rung, which is exactly the shape the loader
    // refuses to restore — the day's progress would come back empty on reload.
    // Undo is how you step back and take another route; the win stands either
    // way, so nothing is lost by refusing here.
    if (prev === TARGET) return reject("already at the target — Undo to step back");
    if (w.length < 4) return reject("four letters");
    if (!WORDSET[w.toLowerCase()]) return reject(w + " isn't in the list");
    if (w === prev) return reject("that's the same word");
    if (diffCount(w, prev) !== 1) return reject("change exactly one letter");
    if (chain.indexOf(w) !== -1) return reject("already used");

    chain.push(w);
    store.chain = chain.slice();
    justAdded = true;

    if (w === TARGET) {
      solved = true;
      store.solved = true;
      // Banked once per date: re-reaching the target after an Undo must not
      // count twice.
      if (!readOnly && store.lastSolved !== puzzleDate) {
        store.streak = (store.lastSolved === shiftDays(puzzleDate, -1)) ? store.streak + 1 : 1;
        store.lastSolved = puzzleDate;
        if (store.streak > store.best) store.best = store.streak;
      }
    }
    save();
    // The win is announced in the live region, not only printed in #status:
    // otherwise a screen-reader player is never told they solved it.
    say(w === TARGET
      ? "added " + w + " · solved in " + (chain.length - 1) + " moves, shortest " + PUZ.par
      : "added " + w);
    el.word.value = "";
    el.word.className = "";
    render();
    // On the winning move the field is put away under the player's caret, so
    // focus goes to the one control that still has a move in it rather than
    // falling to <body>, where the next Tab would restart from the top.
    if (w === TARGET) { try { el.undo.focus(); } catch (e) { /* ignore */ } }
    else el.word.focus();
  }

  function undo() {
    if (chain.length <= 1) return;
    var undoHadFocus = document.activeElement === el.undo;
    // Stepping back off the target puts the input row back on the board, and
    // the caret goes with it: the point of this Undo is to type something else.
    var leavingTarget = chain[chain.length - 1] === TARGET;
    chain.pop();
    store.chain = chain.slice();
    // store.solved is NOT cleared: the win belongs to the date. Undo walks the
    // chain back so a player can explore or replay; it does not un-win the day,
    // and the streak it banked stays banked exactly once.
    save();
    say("");
    // The strike-through is the visible half of a verdict the message line has
    // just dropped; left behind it is a refusal with no reason, on a word the
    // shortened chain may now accept.
    el.word.className = "";
    render();
    // Disabling the button that holds focus drops activeElement to BODY.
    if (leavingTarget || (undoHadFocus && el.undo.disabled)) el.word.focus();
  }

  // An IME's in-flight text is not typed text yet. Assigning .value while a
  // composition is open commits the half-formed reading and collapses the
  // composition range, so the IME's next update appends to what was committed
  // instead of replacing it: composing "held" used to land HHEH in the field.
  // The fold waits for compositionend, which is the point the text is real.
  el.word.addEventListener("compositionstart", function () { composing = true; });
  // A field that loses focus has no composition left to protect; without this a
  // compositionend that never arrives would leave the fold switched off.
  el.word.addEventListener("blur", function () {
    if (!composing) return;
    composing = false;
    normalise();
  });
  el.word.addEventListener("compositionend", function () {
    composing = false;
    el.word.className = "";
    normalise();
  });
  el.word.addEventListener("input", function (e) {
    el.word.className = "";
    if (composing || (e && e.isComposing)) return;
    normalise();
  });
  el.form.addEventListener("submit", function (e) { e.preventDefault(); commit(); });
  el.undo.addEventListener("click", undo);

  render();
  // A board that loads already at the target has no field to put the caret in;
  // grabbing focus for a row that is not on screen would drop it on <body>.
  if (chain[chain.length - 1] !== TARGET) { try { el.word.focus(); } catch (e) { /* ignore */ } }
  // A ?d= that is not a date is not silently ignored.
  if (dparam.bad) say("that ?d= isn't a date — showing today", true);

  /* The seam tests.html drives. No behaviour depends on it. */
  window.WL = {
    WORDS: WORDS, NBR: NBR, COMP: COMP, KEY: KEY,
    utcDateStr: utcDateStr, isDateStr: isDateStr, shiftDays: shiftDays,
    fnv1a32: fnv1a32, mulberry32: mulberry32,
    puzzleFor: puzzleFor, pathOf: pathOf, diffCount: diffCount,
    puzzle: PUZ, puzzleDate: puzzleDate, readOnly: readOnly, today: today,
    state: function () { return { chain: chain.slice(), solved: solved }; }
  };
}());
</script>
</body>
</html>
